services:

  db:
    image: mysql:8.0
    container_name: wordpress-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  wordpress:
    image: wordpress:6.7-apache
    container_name: wordpress-app
    ports:
      - "8080:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/www/html
      - ./web:/var/www/html/wp-content/themes/webfusion
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Instala WordPress y activa el tema automáticamente, luego termina.
  wpcli:
    image: wordpress:cli
    container_name: wordpress-cli
    user: "33:33"          # mismo UID que www-data en la imagen apache
    environment:
      <<: *wp-env
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wp_data:/var/www/html
      - ./web:/var/www/html/wp-content/themes/webfusion
      - ./wp-cli:/scripts:ro
    entrypoint: ["sh", "/scripts/install.sh"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    restart: "no"

volumes:
  db_data:
  wp_data:
